function checkWin(){teaseWin();if(completed===8&&!victoryShown){victoryShown=true;countStart();const elapsed=Date.now()-gameStart;if(!wonThisGame){record.wins++;record.best=record.best===null?elapsed:Math.min(record.best,elapsed);storeRecord();wonThisGame=true;}message('全8組完成！ '+timeText(elapsed)+' · 最速 '+timeText(record.best));render();setTimeout(()=>{if(completed===8&&victoryShown)showVictory()},950)}}function deal(){if(dealing||!stock.length)return;countStart();save();dealing=true;selected=null;resetHints();message('配っています…');render();let i=0;function next(){if(i>=10){dealing=false;moves++;clearSets();message('10列に1枚ずつ配りました');render();playCelebrations();checkWin();return}let c=stock.pop();c.up=true;columns[i].push(c);render();const target=board.children[i]?.lastElementChild;if(target){target.classList.add('dealt-card');target.style.setProperty('--deal-x',Math.round(stockEl.getBoundingClientRect().left-target.getBoundingClientRect().left)+'px');target.style.setProperty('--deal-y',Math.round(stockEl.getBoundingClientRect().top-target.getBoundingClientRect().top)+'px')}i++;setTimeout(next,115)}next()}function choose(a,i){if(dealing)return;resetHints();if(selected){let s=selected;if(move(s.a,s.i,a))return;if(validRun(a,i)){selected={a,i};message('移動先の列をクリックしてね');render();return}selected=null;render();return}if(validRun(a,i)){selected={a,i};message('移動先の列をクリックしてね');render()}else{message('同じマークで数字が続く表向きのカードを選んでね')}}function render(){board.innerHTML='';columns.forEach((col,a)=>{let lane=document.createElement('div');lane.className='column'+(selected?' target':'')+(hintActive?.b===a&&!col.length?' hint-empty':'');lane.dataset.col=a;lane.addEventListener('click',e=>{if(e.target===lane&&selected)move(selected.a,selected.i,a)});let y=4;col.forEach((c,i)=>{let card=document.createElement('div');card.className='card '+(c.up?(c.s==='H'?'suit-h':'suit-s'):'back')+(selected?.a===a&&i>=selected.i?' selected':'')+(hintActive?.a===a&&i===hintActive.i?' hint-from':'')+(hintActive?.b document.getElementById('new').onclick=()=>{if(confirm('新しいゲームを始める？ 現在のゲームは消えます。'))newGame()};document.getElementById('undo').onclick=()=>{if(dealing||!history.length)return;let h=history.pop();columns=h.columns;stock=h.stock;completed=h.completed;victoryShown=completed===8;completedSuits=h.completedSuits||[];celebrationQueue=[];lastTease=completed;clearTease();document.querySelectorAll('.celebration-overlay').forEach(e=>e.remove());flashUntil=0;moves=h.moves;selected=null;resetHints();message('一手戻しました');render()};function getHints(){

      for(let b=0;b<10;b++){

        // Moving to another column with no increase in same-suit connections
        // is worthwhile only if it reveals a face-down card.

        // Moving to an empty column without revealing anything is not helpful.
        if(!top&&!exposesBack)continue;
        // Avoid breaking a run to attach it elsewhere unless the total number
        // of same-suit connections increases (or a hidden card is uncovered).
        const splits=!!above?.up&&above.s===first.s&&above.n===first.n+1;
        if(splits&&gain<=0&&!exposesBack)continue;
        if(top&&!same&&!exposesBack)continue;

    }

  results.sort((x,y)=>y.score-x.score||x.a-y.a||x.b-y.b||x.i-y.i);
