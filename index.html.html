<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>カード整理</title><style>
:root{font-family:system-ui,'Yu Gothic',sans-serif;color:#fff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 10%,#21815b,#075035 80%);min-height:100vh}header{padding:15px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#063d2b}h1{font-size:21px;margin:0 18px 0 0}button{border:0;border-radius:9px;padding:10px 15px;background:#f5e9c8;color:#173a2c;font-weight:700;cursor:pointer}button:hover{filter:brightness(.94)}button:disabled{opacity:.45;cursor:not-allowed}.info{margin-left:auto;font-weight:700}.help{padding:10px 20px;font-size:13px;color:#e3f4e8}.board{display:grid;grid-template-columns:repeat(10,minmax(75px,1fr));gap:8px;padding:12px 14px 250px;min-width:850px}.column{position:relative;min-height:490px;border:1px solid #ffffff38;border-radius:8px;background:#ffffff0a}.card{position:absolute;left:4px;right:4px;height:105px;border-radius:8px;border:1px solid #b5b5b5;background:#fff;color:#222;box-shadow:0 2px 5px #0004;cursor:pointer;user-select:none;touch-action:none}.card.red{color:#c82636}.card.back{background:repeating-linear-gradient(45deg,#234a94,#234a94 6px,#365eb2 6px,#365eb2 12px);border:4px solid white;cursor:default}.card .corner{padding:4px 6px;font-size:18px;font-weight:800;line-height:1.05}.card .suit{font-size:20px}.card .center{position:absolute;right:8px;bottom:7px;font-size:28px}.card.selected{outline:3px solid #ffe15a;box-shadow:0 0 12px #ffe15a}.column.target{outline:2px dashed #fff7b0}.bottom{position:fixed;bottom:0;left:0;right:0;background:#063d2bf0;padding:12px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}.stock{display:flex;gap:5px}.stockpile{width:43px;height:62px;border:2px solid white;border-radius:5px;background:repeating-linear-gradient(45deg,#234a94,#234a94 5px,#365eb2 5px,#365eb2 10px);cursor:pointer}.stockpile.empty{background:transparent;border-style:dashed;cursor:default}.completed{font-size:18px}.message{font-size:13px;color:#ffecb3}.viewport{overflow-x:auto} @media(max-width:700px){h1{font-size:17px}.info{margin-left:0}.help{font-size:12px}.board{gap:5px;padding-left:7px;padding-right:7px}.card{height:100px}}

/* Monochrome office-style theme */
:root{color:#202020;color-scheme:light}
body{background:#f7f7f7;color:#202020}
header{background:#fff;border-bottom:1px solid #d5d5d5}
h1{font-size:18px;font-weight:600;color:#222}
button{background:#f2f2f2;color:#222;border:1px solid #c9c9c9;border-radius:5px;font-weight:500}
button:hover{background:#e5e5e5;filter:none}
.help{color:#666;background:#fafafa}
.column{background:#f0f0f0;border:1px solid #d5d5d5}
.card{background:#fff;color:#111;border:1px solid #999;box-shadow:0 1px 2px #0002;border-radius:5px}
.card.red{color:#444}
.card.back{background:repeating-linear-gradient(45deg,#d4d4d4,#d4d4d4 5px,#ededed 5px,#ededed 10px);border:3px solid #fff;outline:1px solid #999}
.card.selected{outline:3px solid #666;box-shadow:0 0 0 1px #444}
.column.target{outline:1px dashed #aaa}
.bottom{background:#fff;border-top:1px solid #d5d5d5;color:#222}
.stockpile{border:2px solid #888;background:repeating-linear-gradient(45deg,#d4d4d4,#d4d4d4 5px,#ededed 5px,#ededed 10px)}
.stockpile.empty{background:transparent;border-color:#aaa}
.message{color:#555}

/* Minimal edition */
body{background:#fff}
header{padding:7px 12px;gap:5px;background:#fff}
header button{width:30px;height:28px;padding:0;font-size:16px;line-height:1;border-radius:3px;background:#fff;border:1px solid #dedede;color:#555}
header button:hover{background:#f2f2f2}
.info{font-size:11px;color:#888;font-weight:400;letter-spacing:.5px}
.board{padding-top:12px;padding-bottom:110px;gap:7px}
.column{background:#fafafa;border:1px solid #eee;border-radius:3px}
.card{border:1px solid #aaa;box-shadow:none;border-radius:3px}
.card.red{color:#111}
.card .corner{padding:4px 6px;font-size:18px;line-height:1.05;white-space:nowrap}
.card .suit{font-size:23px;line-height:1.1}
.card .suit-letter{font-size:10px;color:#666;font-weight:500;margin-left:5px;vertical-align:3px}
.card .center{font-size:27px;right:7px;bottom:5px}
.card.back{background:repeating-linear-gradient(0deg,#f4f4f4,#f4f4f4 5px,#e6e6e6 5px,#e6e6e6 6px);border:2px solid #fff;outline:1px solid #aaa}
.card.selected{outline:2px solid #555;box-shadow:none}
.column.target{outline:1px dashed #aaa}
.bottom{padding:7px 12px;gap:12px;background:#fff;border-top:1px solid #eee;min-height:48px}
.stockpile{width:28px;height:39px;border:1px solid #999;border-radius:2px;background:repeating-linear-gradient(0deg,#f4f4f4,#f4f4f4 5px,#ddd 5px,#ddd 6px)}
.stockpile.empty{border:1px dashed #ddd}
.completed{font-size:12px;color:#777}
.message{font-size:11px;color:#888}
/* Suit colors without suit icons */
.card.suit-s{background:#fff;color:#111;border-color:#9c9c9c}
.card.suit-h{background:#d6d6d6;color:#111;border-color:#999}
.card .corner{font-size:21px;padding:5px 7px}
.card .center{display:none}
.card.back{background:repeating-linear-gradient(0deg,#b4b4b4,#b4b4b4 5px,#c3c3c3 5px,#c3c3c3 6px);border:2px solid #f5f5f5;outline:1px solid #888}

/* White, unfilled columns; lightweight numbers */
.column{background:#fff;border-color:#f3f3f3}
.card .corner{font-weight:400}
.card{cursor:grab}
.card:active{cursor:grabbing}
.drag-ghost{position:fixed;pointer-events:none;z-index:10000;opacity:.9;filter:drop-shadow(0 3px 5px #8885)}
body.dragging,body.dragging *{cursor:grabbing!important}

/* Compact spreadsheet-style layout */
body{font-family:Arial,'Yu Gothic',sans-serif;background:#fff}
.board{grid-template-columns:repeat(10,minmax(52px,1fr));min-width:620px;gap:4px;padding:8px 10px 75px}
.column{border:1px solid #ededed;border-radius:0;background:#fff;min-height:420px}
.card,.card.suit-s,.card.suit-h{height:30px;border-radius:0;box-shadow:none;left:1px;right:1px;border:1px solid #d4d4d4;cursor:grab;color:#222}
.card.suit-s{background:#fff}
.card.suit-h{background:#dedede}
.card .corner{font-size:14px;font-weight:400;padding:5px 8px;line-height:18px}
.card.back{height:20px;background:#b7b7b7;border:1px solid #ddd;outline:none}
.card.selected{outline:1px solid #777;box-shadow:none}
.column.target{outline:1px dashed #aaa}
.card.hint-from{outline:2px solid #555;outline-offset:-2px;z-index:100!important}
.card.hint-to{outline:2px dashed #777;outline-offset:-2px;z-index:100!important}
.column.hint-empty{outline:2px dashed #777;outline-offset:-2px}
header{padding:5px 10px}
.bottom{padding:5px 10px;min-height:36px}
.stockpile{width:23px;height:27px;border-radius:0;background:#b7b7b7}
.drag-ghost{filter:none;opacity:.88}
@media(max-width:700px){.board{min-width:620px}.card{height:30px}}
header .stock{display:flex;gap:3px;align-items:center;margin-left:8px}header .stockpile{width:19px;height:25px;cursor:pointer}header .stockpile.empty{cursor:default}#trophies{display:flex;gap:3px;align-items:center;margin-left:10px}
.trophy{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid #ddd;color:#bbb;background:#fff;font-size:13px;font-weight:400}
.trophy.filled{background:#555;color:white;border-color:#555}
.trophy.new{animation:completedPop .55s ease-out 2}
@keyframes completedPop{0%{transform:scale(1);background:#555}45%{transform:scale(1.35);background:#111}100%{transform:scale(1);background:#555}}

/* Outline continuous descending runs of the same suit, with no suit symbols. */
.card.same-run{border-left:1px solid #999!important;border-right:1px solid #999!important}
.card.same-run.run-start{border-top:1px solid #999!important}
.card.same-run:not(.run-start){border-top:0!important}
.card.same-run.run-end{border-bottom:1px solid #999!important}
.card.same-run:not(.run-end){border-bottom:0!important}
/* Cards arrive one column at a time from the stock control. */
.card.dealt-card{animation:dealSlide .22s ease-out both;pointer-events:none;z-index:200!important}
@keyframes dealSlide{from{transform:translate(var(--deal-x),var(--deal-y)) scale(.75);opacity:.55}to{transform:translate(0,0) scale(1);opacity:1}}

/* A restrained fly-to-counter completion animation. */
.completion-fly{position:fixed;z-index:30000;pointer-events:none;width:65px;height:44px;border:1px solid #aaa;background:linear-gradient(180deg,#fff 50%,#ddd 50%);box-shadow:0 2px 9px #0002;border-radius:2px;transform-origin:center;transition:transform .72s cubic-bezier(.3,.05,.45,1),opacity .72s ease-in}
#trophies .trophy.arrived{animation:arrivalBounce .65s ease-out both;box-shadow:0 0 0 2px #aaa,0 0 13px #aaa}
@keyframes arrivalBounce{0%{transform:scale(1)}40%{transform:scale(1.5);background:#fff;color:#222}70%{transform:scale(.92)}100%{transform:scale(1);background:#555;color:white}}
/* Keep a visible divider where one connected run ends and another begins. */


/* Brief, escalating jackpot-style anticipation after sets 5, 6 and 7. */
.tease-flash{position:fixed;inset:0;pointer-events:none;z-index:35000;animation:teaseFlash .85s ease-out forwards}
@keyframes teaseFlash{0%{opacity:0}22%{opacity:1}100%{opacity:0}}
.tease-flash.stage-5{background:radial-gradient(ellipse at 90% 3%,#fff9,transparent 40%)}
.tease-flash.stage-6{background:linear-gradient(100deg,transparent 10%,#f8d97b55 48%,transparent 80%)}
.tease-flash.stage-7{background:linear-gradient(110deg,transparent 15%,#f9b4fc66 40%,#9ee9ff88 55%,transparent 85%)}
#trophies.tease-5 .trophy.filled{animation:teaseShine .65s ease-out}
#trophies.tease-6 .trophy.filled{animation:teaseBounce .55s ease-out 2}
#trophies.tease-7 .trophy.filled{animation:teaseRainbow .85s ease-in-out 2}
body.tease-border header{animation:teaseHeader 1.1s ease-out}
.tease-last{position:fixed;top:57px;right:20px;z-index:36000;pointer-events:none;font:bold 17px Arial,sans-serif;letter-spacing:.18em;color:#333;text-shadow:0 0 12px #fff;background:#ffffffed;border:1px solid #d4d4d4;padding:7px 14px;animation:teaseLast 1.35s ease-in-out both}
@keyframes teaseShine{50%{filter:brightness(1.8);box-shadow:0 0 12px #cfcfcf}}
@keyframes teaseBounce{45%{transform:scale(1.24);box-shadow:0 0 14px #e9ce76}}
@keyframes teaseRainbow{0%,100%{box-shadow:0 0 0 transparent}40%{box-shadow:0 0 15px #fa7bce,0 0 22px #6bcfff;filter:hue-rotate(100deg);transform:scale(1.16)}}
@keyframes teaseHeader{50%{box-shadow:0 0 19px #e6d38a,inset 0 0 12px #f6e6ae}}
@keyframes teaseLast{0%{opacity:0;transform:translateY(-9px) scale(.9)}25%,70%{opacity:1;transform:translateY(0) scale(1.08)}100%{opacity:0;transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.tease-flash,.tease-last,#trophies.tease-5 .trophy.filled,#trophies.tease-6 .trophy.filled,#trophies.tease-7 .trophy.filled,body.tease-border header{animation:none!important}}
/* Full-game victory: deliberately festive, unlike ordinary set completion. */
.win-overlay{position:fixed;inset:0;z-index:50000;display:grid;place-items:center;background:rgba(15,17,22,.84);overflow:hidden;color:white;isolation:isolate}
.win-panel{position:relative;z-index:3;text-align:center;padding:38px 48px;max-width:90vw;border:1px solid #ffffff70;background:#171b26d9;box-shadow:0 15px 70px #0009;animation:winPanelIn .8s cubic-bezier(.16,1,.3,1) both}
.win-title{font-size:clamp(38px,7vw,82px);font-weight:900;letter-spacing:.12em;text-shadow:0 0 24px #ffffff88;animation:winGlow 1.4s ease-in-out infinite alternate}
.win-sub{font-size:15px;letter-spacing:.15em;margin:12px 0 24px;color:#eee}
.win-buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.win-buttons button{font-size:14px;padding:9px 16px;background:#fff;border:0;color:#222;cursor:pointer}
.win-buttons button:hover{background:#e8e8e8}
.win-particle{position:absolute;z-index:1;pointer-events:none;left:var(--x);top:var(--y);width:var(--w);height:var(--h);background:var(--c);opacity:0;animation:winFall var(--dur) linear var(--delay) infinite;transform:rotate(var(--rot))}
.win-overlay.fireworks .win-particle{border-radius:50%;width:5px;height:5px;box-shadow:0 0 12px var(--c);animation:winBurst var(--dur) ease-out var(--delay) infinite}
.win-overlay.numbers .win-particle{width:auto;height:auto;background:none;font-size:var(--fs);font-weight:700;color:var(--c);animation:winNumbers var(--dur) linear var(--delay) infinite}
.win-overlay.stars .win-particle{width:auto;height:auto;background:none;font-size:var(--fs);color:var(--c);text-shadow:0 0 18px var(--c);animation:winStars var(--dur) ease-in-out var(--delay) infinite}
@keyframes winPanelIn{from{opacity:0;transform:scale(.55) rotate(-5deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes winGlow{from{text-shadow:0 0 10px #fff5;transform:scale(1)}to{text-shadow:0 0 35px #ffe39a,0 0 70px #f7b25b;transform:scale(1.04)}}
@keyframes winFall{0%{opacity:0;transform:translate3d(0,-20vh,0) rotate(0)}8%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translate3d(var(--dx),110vh,0) rotate(900deg)}}
@keyframes winBurst{0%{opacity:0;transform:translate(0,0) scale(.2)}12%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
@keyframes winNumbers{0%{opacity:0;transform:translateY(-25vh) rotate(-15deg)}10%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx),105vh) rotate(35deg)}}
@keyframes winStars{0%{opacity:0;transform:scale(0) rotate(0)}35%{opacity:1;transform:scale(2) rotate(100deg)}70%{opacity:.9;transform:scale(1.2) rotate(220deg)}100%{opacity:0;transform:scale(0) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.win-particle,.win-title,.win-panel{animation:none!important}.win-particle{display:none}}

/* Fifth ending: deliberately flashy rainbow jackpot-style lights. */
.win-overlay.rainbow{background:radial-gradient(ellipse at center,#261039 0%,#080910 78%)}
.win-overlay.rainbow::before{content:"";position:absolute;inset:-55%;z-index:0;background:conic-gradient(from 0deg,#ff244c,#ffac2b,#fff33d,#4bff8a,#28dfff,#6554ff,#ff44dd,#ff244c);opacity:.6;filter:blur(42px);animation:rainbowSpin 5s linear infinite}
.win-overlay.rainbow::after{content:"";position:absolute;inset:5%;z-index:0;border:8px solid transparent;border-image:linear-gradient(90deg,red,orange,yellow,lime,cyan,blue,violet,red) 1;box-shadow:0 0 28px #fff9,inset 0 0 28px #fff7;animation:rainbowPulse .65s ease-in-out infinite alternate}
.win-overlay.rainbow .win-panel{background:#111322ef;border:4px solid #fff;box-shadow:0 0 18px #fff,0 0 50px #f0f,0 0 85px #0ff;animation:winPanelIn .8s cubic-bezier(.16,1,.3,1) both,rainbowPulse .8s ease-in-out .8s infinite alternate}
.win-overlay.rainbow .win-title{background:linear-gradient(90deg,#ff3c70,#ffe33b,#56ff98,#3bdfff,#bb67ff,#ff3c70);background-size:300% 100%;color:transparent;background-clip:text;-webkit-background-clip:text;filter:drop-shadow(0 0 10px #fff);animation:rainbowFlow 1.2s linear infinite}
.win-overlay.rainbow .win-particle{width:auto;height:auto;background:none;font-size:var(--fs);color:var(--c);text-shadow:0 0 12px currentColor,0 0 25px currentColor;animation:winStars var(--dur) ease-in-out var(--delay) infinite}
@keyframes rainbowSpin{to{transform:rotate(360deg)}}
@keyframes rainbowPulse{from{opacity:.7;filter:brightness(.9)}to{opacity:1;filter:brightness(1.6)}}
@keyframes rainbowFlow{to{background-position:300% 0}}
@media(prefers-reduced-motion:reduce){.win-overlay.rainbow::before,.win-overlay.rainbow::after,.win-overlay.rainbow .win-panel{animation:none!important}}
.preview-label{font-size:12px;letter-spacing:2px;color:#777;margin-bottom:12px;text-align:center} /* The next overlapping card covers the preceding card's bottom edge.
   Draw the divider on the visible top edge of the next card instead. */
.card.after-run-boundary{border-top:1px solid #999!important}

/* Ultra-rare ending: blackout followed by rainbow jackpot */
.win-overlay.rainbow-premium{background:#090610}
.win-overlay.rainbow-premium::before{content:"";position:absolute;inset:-60%;background:conic-gradient(#f05,#ffb900,#ff0,#00ff81,#00ddff,#7755ff,#f0f,#f05);filter:blur(24px);animation:rainbowSpin 2.2s linear infinite;opacity:.85}
.win-overlay.rainbow-premium::after{content:"";position:absolute;inset:3%;border:12px solid transparent;border-image:linear-gradient(45deg,#f05,#ff0,#0f9,#0cf,#a0f,#f05) 1;box-shadow:0 0 60px #fff, inset 0 0 60px #fff8;animation:rainbowPulse .25s infinite alternate}
.win-overlay.rainbow-premium .win-panel{border:5px solid white;background:#12071ff2;box-shadow:0 0 25px #fff,0 0 90px #f0f,0 0 130px #0ff;animation:winPanelIn .6s both,rainbowPulse .4s .6s infinite alternate}
.win-overlay.rainbow-premium .win-title{font-size:clamp(44px,9vw,110px);background:linear-gradient(90deg,red,orange,yellow,lime,cyan,blue,violet,red);background-size:300% 100%;background-clip:text;-webkit-background-clip:text;color:transparent;animation:rainbowFlow .7s linear infinite}
.win-overlay.rainbow-premium .win-particle{background:none;width:auto;height:auto;font-size:var(--fs);color:var(--c);text-shadow:0 0 15px currentColor;animation:winStars var(--dur) ease-in-out var(--delay) infinite}
.win-overlay.premium-intro::before,.win-overlay.premium-intro::after,.win-overlay.premium-intro .win-panel,.win-overlay.premium-intro .win-particle{visibility:hidden}
.premium-blackout{position:absolute;inset:0;background:#000;z-index:10;display:grid;place-items:center;font-size:60px;color:#fff;animation:premiumSpark 1.8s ease-in-out both}
@keyframes premiumSpark{0%,58%{color:#000}78%{color:#fff;text-shadow:0 0 30px white}100%{color:#000}}
@media(prefers-reduced-motion:reduce){.win-overlay.rainbow-premium::before,.win-overlay.rainbow-premium::after,.win-overlay.rainbow-premium .win-panel{animation:none!important}}

/* Rare rainbow-and-gold finish */
.win-overlay.rainbow-gold{background:#120900}
.win-overlay.rainbow-gold::before{content:"";position:absolute;inset:-60%;background:conic-gradient(#ff0080,#ffd700,#fff7ad,#00ffbb,#00bfff,#8b00ff,#ffd700,#ff0080);filter:blur(17px);animation:rainbowSpin 1.6s linear infinite;opacity:.95}
.win-overlay.rainbow-gold::after{content:"";position:absolute;inset:3%;border:14px solid #ffcf28;box-shadow:0 0 28px #fff,0 0 80px #ffd700,inset 0 0 75px #ffde58;animation:rainbowPulse .32s infinite alternate}
.win-overlay.rainbow-gold .win-panel{border:6px double #ffe16c;background:#170a16ee;box-shadow:0 0 45px #ffd700,0 0 95px #fff;animation:winPanelIn .6s both,rainbowPulse .6s .6s infinite alternate}
.win-overlay.rainbow-gold .win-title{font-size:clamp(44px,9vw,110px);background:linear-gradient(90deg,#ffd700,#fff,#ffb900,#ff0080,#00ffff,#fff,#ffd700);background-size:300% 100%;background-clip:text;-webkit-background-clip:text;color:transparent;animation:rainbowFlow .75s linear infinite}
.win-overlay.rainbow-gold .win-particle{background:none;width:auto;height:auto;font-size:var(--fs);color:#ffe25c;text-shadow:0 0 20px #fff,0 0 35px gold;animation:winStars var(--dur) ease-in-out var(--delay) infinite}
.win-overlay.rainbow-gold.premium-intro::before,.win-overlay.rainbow-gold.premium-intro::after,.win-overlay.rainbow-gold.premium-intro .win-panel,.win-overlay.rainbow-gold.premium-intro .win-particle{visibility:hidden}
/* Fake-out clear -> 1.8s blackout -> rainbow revival */
.win-overlay.revival{background:#0d001c}
.win-overlay.revival::before{content:"";position:absolute;inset:-60%;background:conic-gradient(#f05,#ffb900,#ff0,#00ff81,#00ddff,#7755ff,#f0f,#f05);filter:blur(19px);animation:rainbowSpin 1.3s linear infinite;opacity:.9}
.win-overlay.revival .win-panel{border:5px solid white;background:#170725ee;box-shadow:0 0 35px #fff,0 0 100px #f0f,0 0 140px #0ff}
.win-overlay.revival .win-title{font-size:clamp(44px,9vw,110px);background:linear-gradient(90deg,red,orange,yellow,lime,cyan,blue,violet,red);background-size:300% 100%;background-clip:text;-webkit-background-clip:text;color:transparent;animation:rainbowFlow .65s linear infinite}
.win-overlay.revival .win-particle{background:none;width:auto;height:auto;font-size:var(--fs);color:var(--c);text-shadow:0 0 18px currentColor;animation:winStars var(--dur) ease-in-out var(--delay) infinite}
.win-overlay.revival-wait{background:#f7f7f7}
.win-overlay.revival-wait::before,.win-overlay.revival-wait .win-panel,.win-overlay.revival-wait .win-particle{visibility:hidden}
.revival-quiet{position:absolute;inset:0;display:grid;place-items:center;color:#666;font-size:clamp(32px,6vw,64px);letter-spacing:.2em;font-weight:400}
.win-overlay.revival-blackout{background:#000}

function clearTease(){
 clearTimeout(teaseTimer);
 document.querySelectorAll('.tease-flash,.tease-last').forEach(e=>e.remove());
 trophies.classList.remove('tease-5','tease-6','tease-7');
 document.body.classList.remove('tease-border');
}
function teaseWin(){
 if(completed<5||completed>=8||completed<=lastTease)return;
 lastTease=completed;
 clearTease();
 const stage=completed>=7?7:completed>=6?6:5;
 const flash=document.createElement('div');flash.className='tease-flash stage-'+stage;
 document.body.appendChild(flash);
 trophies.classList.add('tease-'+stage);
 if(stage>=6)document.body.classList.add('tease-border');
 if(stage===7){
  const label=document.createElement('div');label.className='tease-last';label.textContent='LAST 1';
  document.body.appendChild(label);
 }
 teaseTimer=setTimeout(clearTease,stage===7?1700:1200);
}
function checkWin(){teaseWin();if(completed===8&&!victoryShown){victoryShown=true;countStart();const elapsed=Date.now()-gameStart;if(!wonThisGame){record.wins++;record.best=record.best===null?elapsed:Math.min(record.best,elapsed);storeRecord();wonThisGame=true;}message('全8組完成！ '+timeText(elapsed)+' · 最速 '+timeText(record.best));render();setTimeout(()=>{if(completed===8&&victoryShown)showVictory()},950)}}function deal(){if(dealing||!stock.length)return;countStart();save();dealing=true;selected=null;resetHints();message('配っています…');render();let i=0;function next(){if(i>=10){dealing=false;moves++;actions++;clearSets();message('10列に1枚ずつ配りました');render();playCelebrations();checkWin();return}let c=stock.pop();c.up=true;columns[i].push(c);render();const target=board.children[i]?.lastElementChild;if(target){target.classList.add('dealt-card');target.style.setProperty('--deal-x',Math.round(stockEl.getBoundingClientRect().left-target.getBoundingClientRect().left)+'px');target.style.setProperty('--deal-y',Math.round(stockEl.getBoundingClientRect().top-target.getBoundingClientRect().top)+'px')}i++;setTimeout(next,115)}next()}function choose(a,i){if(dealing)return;resetHints();if(selected){let s=selected;if(move(s.a,s.i,a))return;if(validRun(a,i)){selected={a,i};message('移動先の列をクリックしてね');render();return}selected=null;render();return}if(validRun(a,i)){selected={a,i};message('移動先の列をクリックしてね');render()}else{message('同じマークで数字が続く表向きのカードを選んでね')}}function render(){board.innerHTML='';columns.forEach((col,a)=>{let lane=document.createElement('div');lane.className='column'+(selected?' target':'')+(hintActive?.b===a&&!col.length?' hint-empty':'');lane.dataset.col=a;lane.addEventListener('click',e=>{if(e.target===lane&&selected)move(selected.a,selected.i,a)});let y=4;col.forEach((c,i)=>{let card=document.createElement('div');card.className='card '+(c.up?(c.s==='H'?'suit-h':'suit-s'):'back')+(selected?.a===a&&i>=selected.i?' selected':'')+(hintActive?.a===a&&i===hintActive.i?' hint-from':'')+(hintActive?.b===a&&i===col.length-1?' hint-to':'');if(c.up){
  const prev=col[i-1],next=col[i+1];
  const joinedPrev=prev?.up&&prev.s===c.s&&prev.n===c.n+1;
  const joinedNext=next?.up&&next.s===c.s&&c.n===next.n+1;
  if(prev?.up&&col[i-2]?.up&&prev.s===col[i-2].s&&col[i-2].n===prev.n+1&&!joinedPrev){card.classList.add('after-run-boundary')}
  if(joinedPrev||joinedNext){
    card.classList.add('same-run');
    if(!joinedPrev)card.classList.add('run-start');
    if(!joinedNext)card.classList.add('run-end');
  }
}card.style.top=y+'px';card.style.zIndex=i+1;card.dataset.col=a;card.dataset.idx=i;if(c.up){card.innerHTML='<div class="corner">'+rank(c.n)+'</div>';card.addEventListener('click',e=>{e.stopPropagation();if(!suppressClick)choose(a,i)});
card.addEventListener('dblclick',e=>{e.stopPropagation();e.preventDefault();if(dealing||!validRun(a,i))return;
 const first=col[i],runLength=col.length-i;let best=null;
 for(let b=0;b<10;b++){if(!canMove(a,i,b))continue;const dest=columns[b],top=dest.at(-1);
 let same=!!top&&top.s===first.s,connected=0;
 if(same){connected=1;for(let k=dest.length-1;k>0;k--){const x=dest[k-1],y=dest[k];if(!x.up||x.s!==y.s||x.n!==y.n+1)break;connected++}}
 const score=(same?1000:0)+connected*25+(i>0&&!col[i-1].up?300:0)+(i===0?100:0)+(dest.length?10:0);
 if(!best||score>best.score)best={b,score};
 }
 if(best){move(a,i,best.b)}else message('移動できる場所がないよ');
});card.addEventListener('pointerdown',e=>{if(e.button!==0||!validRun(a,i))return;drag={a,i,x:e.clientX,y:e.clientY,moved:false,ghost:null,source:card};});}lane.appendChild(card);y+=c.up?29:18});lane.style.minHeight=Math.max(420,y+34)+'px';board.appendChild(lane)});stockEl.innerHTML='';for(let i=0;i<5;i++){let d=document.createElement('div');d.className='stockpile'+(i>=stock.length/10?' empty':'');if(i<stock.length/10)d.addEventListener('click',deal);stockEl.appendChild(d)}doneEl.textContent=completed+' / 8';trophies.innerHTML='';for(let k=0;k<8;k++){let tile=document.createElement('span');tile.className='trophy'+(k<completed?' filled':'');tile.textContent=k<completed?'✓':'·';tile.title=k<completed?'完成 '+(k+1)+'組目':'未完成';trophies.appendChild(tile)}stats.textContent=moves+' · '+stock.length/10+'  |  '+record.wins+'/'+record.played+' ('+(record.played?Math.round(record.wins/record.played*100):0)+'%)';stats.title='クリア数 / プレイ数（勝率）'+(record.best===null?'':' · 最速 '+timeText(record.best));document.getElementById('restart').disabled=dealing;document.getElementById('undo').disabled=dealing||!history.length}function removeGhost(){document.querySelector('.drag-ghost')?.remove();document.body.classList.remove('dragging')}
document.addEventListener('pointermove',e=>{if(!drag)return;let d=drag;if(!d.moved&&Math.hypot(e.clientX-d.x,e.clientY-d.y)>7){d.moved=true;d.ghost=document.createElement('div');d.ghost.className='drag-ghost';let src=columns[d.a].slice(d.i);d.ghost.style.width=d.source.getBoundingClientRect().width+'px';d.ghost.style.height=(30+(src.length-1)*29)+'px';src.forEach((c,j)=>{let card=document.createElement('div');card.className='card '+(c.s==='H'?'suit-h':'suit-s');card.style.top=(j*29)+'px';card.style.left='0';card.style.right='0';card.innerHTML='<div class="corner">'+rank(c.n)+'</div>';d.ghost.appendChild(card)});document.body.appendChild(d.ghost);document.body.classList.add('dragging')}if(d.moved){d.ghost.style.left=(e.clientX-30)+'px';d.ghost.style.top=(e.clientY-12)+'px'}});
document.addEventListener('pointerup',e=>{if(!drag)return;let d=drag;drag=null;if(!d.moved)return;removeGhost();suppressClick=true;setTimeout(()=>suppressClick=false,0);let el=document.elementFromPoint(e.clientX,e.clientY);let lane=el?.closest('.column');if(lane){move(d.a,d.i,Number(lane.dataset.col))}else message('移動先の列にドロップしてね')});
document.addEventListener('pointercancel',()=>{drag=null;removeGhost()});
document.getElementById('restart').onclick=()=>{if(!dealing&&confirm('同じカード配置で最初からやり直す？'))restartGame()};document.getElementById('new').onclick=()=>{if(confirm('新しいゲームを始める？ 現在のゲームは消えます。'))newGame()};document.getElementById('undo').onclick=()=>{if(dealing||!history.length)return;undosUsed++;actions++;let h=history.pop();columns=h.columns;stock=h.stock;completed=h.completed;victoryShown=completed===8;completedSuits=h.completedSuits||[];celebrationQueue=[];lastTease=completed;clearTease();document.querySelectorAll('.celebration-overlay').forEach(e=>e.remove());flashUntil=0;moves++;selected=null;resetHints();message('一手戻しました');render()};function getHints(){
  // A hint must actually improve the board, not merely relocate an intact run.
  const links=col=>col.reduce((n,c,i)=>n+(i>0&&c.up&&col[i-1].up&&col[i-1].s===c.s&&col[i-1].n===c.n+1?1:0),0);
  let results=[];
  for(let a=0;a<10;a++){
    const src=columns[a];
    for(let i=0;i<src.length;i++){
      if(!validRun(a,i))continue;
      const run=src.slice(i),first=run[0],above=src[i-1];
      const exposesBack=i>0&&!above.up,empties=i===0;
      for(let b=0;b<10;b++){
        if(!canMove(a,i,b))continue;
        const dest=columns[b],top=dest.at(-1);
        const same=!!top&&top.s===first.s;
        const before=links(src)+links(dest);
        const after=links(src.slice(0,i))+links(dest.concat(run));
        const gain=after-before;
        // Never suggest a pointless transfer, even when both runs look tidy.
        // Moving to another column with no increase in same-suit connections
        // is worthwhile only if it reveals a face-down card.
        if(gain<=0&&!exposesBack)continue;
        // Moving to an empty column without revealing anything is not helpful.
        if(!top&&!exposesBack)continue;
        // Avoid breaking a run to attach it elsewhere unless the total number
        // of same-suit connections increases (or a hidden card is uncovered).
        const splits=!!above?.up&&above.s===first.s&&above.n===first.n+1;
        if(splits&&gain<=0&&!exposesBack)continue;
        if(top&&!same&&!exposesBack)continue;
        let destLength=0;
        if(same){destLength=1;for(let k=dest.length-1;k>0;k--){const x=dest[k-1],y=dest[k];if(!x.up||x.s!==y.s||x.n!==y.n+1)break;destLength++}}
        const score=gain*200+(exposesBack?160:0)+(empties?30:0)+destLength*8-(splits?35:0);
        results.push({a,i,b,score});
      }
    }
  }
  results.sort((x,y)=>y.score-x.score||x.a-y.a||x.b-y.b||x.i-y.i);
  return results;
}

document.getElementById('hint').onclick=()=>{if(dealing)return;hintsUsed++;if(!hintCandidates.length){hintCandidates=getHints();hintIndex=-1}if(!hintCandidates.length){resetHints();message('おすすめできる手はないよ');render();return}hintIndex=(hintIndex+1)%hintCandidates.length;hintActive=hintCandidates[hintIndex];selected=null;message('');render()};document.getElementById("home").onclick=home;newGame();home()})();
